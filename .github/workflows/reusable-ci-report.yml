name: Reusable CI report
on:
  workflow_call:
permissions:
  contents: read
  checks: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Post CI summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Not a pull request event. Skipping."
            exit 0
          fi
          MARKER="<!-- org-ci-report -->"
          ROWS="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs[] | "- " + .name + ": " + .status + " / " + (.conclusion // "pending")')"
          BODY="$(printf '%s\n\nCI report (advisory, informational only)\n\n%s\n\nFull logs: %s' "${MARKER}" "${ROWS}" "${RUN_URL}")"
          EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("<!-- org-ci-report -->")) | .id' | head -n 1)"
          if [ -n "${EXISTING:-}" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING}" --method PATCH -f body="${BODY}" > /dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --method POST -f body="${BODY}" > /dev/null
          fi
          exit 0
